# mise configuration for chezmoi dotfiles project
# Development tools for shell scripting and testing
# Refresh without installing tools (including after a Renovate version change):
# MISE_SAFE=1 MISE_MINIMUM_RELEASE_AGE=7d mise lock --bump --platform linux-x64,linux-arm64,macos-x64,macos-arm64
# Compatibility floor for the verification and lock semantics tested here, not an update pin.
min_version = "2026.10.25"

[tools]
chezmoi = "2.74.0"
# Pinned: Bun runs the Renovate and Zellij npm-style manager tests in CI.
bun = "1.4.4"
shfmt = "3.14.1"

[settings]
# Keep shims, exec, and tasks from installing tools as a side effect.
auto_install = false
# A missing configured shim must not run an unrelated tool from PATH.
not_found_system_fallback = false
# Exact pins and existing lock entries bypass the age filter; review those updates.
minimum_release_age = "7d"
locked_verify_provenance = true
provenance_api_failures_fatal = true
github_attestations = true
slsa = true

[settings.aqua]
cosign = true
github_attestations = true
minisign = true
slsa = true

[settings.node]
verify = true

[settings.go]
skip_checksum = false
