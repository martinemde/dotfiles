"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

# dir | (jj) | model | cost
format = """
[](fg:#D97757)\
$directory\
${custom.jj}
${env_var.CLAUDE_MODEL}\
${env_var.CLAUDE_CONTEXT}
${env_var.CLAUDE_SUMMARY}\
${env_var.CLAUDE_SESSION_ID}\
"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[directory]
style = "fg:sky"
format = "[ $path ]($style)"
truncation_length = 2
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"src" = ""
"dotfiles" = "󰇙"

# Custom jj (Jujutsu) module - replaces git_branch/git_status
[custom.jj]
command = "jj-prompt"
when = true
format = "$output"
shell = ["bash"]
ignore_timeout = true

[env_var.CLAUDE_MODEL]
variable = "CLAUDE_MODEL"
format = "[$env_value ]($style)"
style = "fg:sapphire"

[env_var.CLAUDE_CONTEXT]
variable = "CLAUDE_CONTEXT"
format = "[$env_value ]($style)"
style = "fg:peach"

[env_var.CLAUDE_SUMMARY]
variable = "CLAUDE_SUMMARY"
format = "[$env_value]($style)"
style = "fg:rosewater"

[env_var.CLAUDE_SESSION_ID]
style = "fg:overlay1"
variable = "CLAUDE_SESSION_ID"
format = "[$env_value]($style)"
