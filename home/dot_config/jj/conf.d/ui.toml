#:schema https://docs.jj-vcs.dev/latest/config-schema.json
# UI and display settings

[ui]
bookmark-list-sort-keys = ["committer-date-"]
# Default command when running 'jj' without arguments
default-command = "status"
# Enable colored output
color = "auto"
editor = "nvim"
pager = "delta"
paginate = "auto"

# Use builtin git diff format so delta only runs as a pager.
# This lets --color=never and --no-pager produce clean output.
diff-formatter = ":git"
diff-editor = ":builtin"

[merge-tools.delta]
diff-expected-exit-codes = [0, 1]

[ui.movement]
# Default to editing when moving with prev/next
edit = true

[[--scope]]
--when.commands = ["status"]
[--scope.ui]
paginate = "never"

[colors]
# Used by log node template
"node" = { bold = true }
"node elided" = { fg = "bright black" }
"node working_copy" = { fg = "green" }
"node conflict" = { fg = "red" }
"node immutable" = { fg = "bright cyan" }
"node wip" = { fg = "yellow" }
"node normal" = { bold = false }

[templates]
# I like this symbol ◉ for @, but it's hard to see
log_node = '''
label("node",
  coalesce(
    if(!self, label("elided", "⇋")),
    if(current_working_copy, label("working_copy", "@")),
    if(conflict, label("conflict", "✕")),
    if(immutable, label("immutable", "◆")),
    if(description.starts_with("wip: "), label("wip", "◠")),
    label("normal", "○")
  )
)
'''
