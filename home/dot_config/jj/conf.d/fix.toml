#:schema https://docs.jj-vcs.dev/latest/config-schema.json
# Fix tools configuration

[fix.tools.prettier]
command = ["npx", "prettier", "--stdin-filepath=$path"]
patterns = [
  "glob:'**/*.ts'",
  "glob:'**/*.js'",
  "glob:'**/*.svelte'",
  "glob:'**/*.tsx'",
  "glob:'**/*.jsx'",
  "glob:'**/*.svx'",
  "glob:'**/*.css'",
  "glob:'**/*.html'",
  "glob:'**/*.json'",
  "glob:'**/*.jsonc'",
  "glob:'**/*.toml'",
]

[fix.tools.markdownlint]
command = ["npx", "markdownlint-cli2", "--format"]
patterns = ["glob:'**/*.md'"]

[fix.tools.rustfmt]
command = ["rustfmt"]
patterns = ["glob:'**/*.rs'"]
