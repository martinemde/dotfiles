# plugins.conf — local, chezmoi-managed session persistence plugins

set -g @continuum-restore 'on'

# Resurrect publishes the save/restore script paths continuum needs.
# Keep these synchronous and after the theme (continuum extends status-right).
run-shell '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
run-shell '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
