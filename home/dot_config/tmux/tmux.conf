# tmux.conf — entry point
# Modular config: theme, bindings, plugins sourced separately

# -- terminal ----------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# -- environment (ensure Homebrew is in PATH for run-shell commands) ---------

set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin"

# -- general -----------------------------------------------------------------

set -sg escape-time 10
set -g repeat-time 600
set -g focus-events on
set -g history-limit 50000

# -- numbering & layout ------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -- interaction --------------------------------------------------------------

set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi
set -g status-keys vi

# -- display timing -----------------------------------------------------------

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 5

# -- activity -----------------------------------------------------------------

setw -g monitor-activity on
set -g visual-activity off

# -- source modular configs ---------------------------------------------------

source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/stacked.conf
source-file ~/.config/tmux/plugins.conf
