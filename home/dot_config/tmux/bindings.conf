# bindings.conf — keybindings

# -- config reload ------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# -- mouse toggle -------------------------------------------------------------

bind m set mouse \; display "mouse #{?mouse,on,off}"

# -- splits with path retention -----------------------------------------------

bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# -- vim-tmux-navigator -------------------------------------------------------

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

bind -n C-h if-shell "tmux display-message -p '#{pane_at_left}' | grep -q 1" "previous-window" "select-pane -LZ"
bind -n C-l if-shell "tmux display-message -p '#{pane_at_right}' | grep -q 1" "next-window" "select-pane -RZ"
# bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -LZ"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -DZ"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -UZ"
# bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -RZ"

# Ctrl-\ last-pane toggle (version-safe escaping)
bind-key -n C-\\ if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# copy-mode-vi pane navigation
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# -- pane resizing ------------------------------------------------------------

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# -- alt+number window switching ----------------------------------------------

bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9

# -- scroll speed (default 5 lines per tick) ----------------------------------

bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# -- vi copy mode -------------------------------------------------------------

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# -- clear screen + scrollback ------------------------------------------------

bind C-l send-keys C-l \; clear-history

# -- pane title ---------------------------------------------------------------

bind T command-prompt -p "Pane title:" "select-pane -T '%%'"

# -- chezmoi / claude ---------------------------------------------------------

set -g @chezmoi_working_tree '#(chezmoi data | jq -r .chezmoi.workingTree)'
