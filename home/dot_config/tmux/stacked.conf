# stacked.conf — Zellij-style stacked panes
# Focused pane in a vertical column expands; siblings collapse to 1 line.
# Disable per-window: prefix S (toggles @stacked-disabled)

# -- hooks (run resize script on focus/structure changes) ------------------

set-hook -g pane-focus-in "run-shell -b '~/.config/tmux/scripts/stacked-resize.sh'"
set-hook -g after-split-window "run-shell -b '~/.config/tmux/scripts/stacked-resize.sh'"
set-hook -g pane-exited "run-shell -b '~/.config/tmux/scripts/stacked-resize.sh'"

# -- opt-out toggle --------------------------------------------------------
# Rapid switching may cause transient visual glitches from concurrent scripts.

bind S if-shell -F '#{@stacked-disabled}' \
    'set-option -wu @stacked-disabled ; run-shell -b "~/.config/tmux/scripts/stacked-resize.sh" ; display "stacked on"' \
    'set-option -w @stacked-disabled 1 ; select-layout even-vertical ; display "stacked off"'
