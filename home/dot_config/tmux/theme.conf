# theme.conf — Catppuccin Mocha + Espresso status bar and pane styling

# -- glyphs (edit these to change symbols) ------------------------------------

set -g @pill_left     ''    # U+E0B6 powerline round left
set -g @pill_right    ''   # U+E0B4 powerline round right
set -g @icon_zoom     '󰊓'    # zoomed pane
set -g @icon_activity '●'    # activity detected (U+25CF black circle)
set -g @icon_bell     ''    # bell occurred
set -g @icon_silence  '~'    # silence interval
set -g @icon_marked   'M'    # marked pane

# -- color reference ----------------------------------------------------------
# crust:    #05050c  (espresso deepest)
# mantle:   #0a0a13  (espresso deep bg)
# base:     #11111b  (mocha crust / status bg)
# surface0: #313244  (raised surface / inactive pill bg)
# surface1: #45475a  (last window pill bg)
# overlay2: #9399b2  (muted text)
# text:     #cdd6f4  (primary fg)
# blue:     #89b4fa  (primary accent / active pill)
# peach:    #fab387  (session name)
# yellow:   #f9e2af  (messages/mode)
# red:      #f38ba8  (sync indicator)

# -- status bar ---------------------------------------------------------------

set -g status-style "fg=#9399b2,bg=#11111b"
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 40

# session name in peach bold
set -g status-left "#[fg=#fab387,bg=#11111b,bold] ❐ #S #[default]"

# right side: native tmux conditionals for indicators
set -g status-right "#[fg=#9399b2,bg=#11111b] #{?client_prefix,#[fg=#fab387]⌨ ,  }#{?mouse,#[fg=#89b4fa]↗ ,  }#{?session_many_attached,#[fg=#cba6f7]⚇ ,}#{?pane_synchronized,#[fg=#f38ba8]⚏ ,} "

# -- window status (pill tabs) ------------------------------------------------

# inactive pill: surface0 bg, muted text (last window gets blue text)
set -g window-status-format "#[fg=#313244,bg=#11111b]#{@pill_left}#{?window_last_flag,#[fg=#89b4fa],#[fg=#9399b2]}#[bg=#313244] #I #W#{?window_zoomed_flag, #{@icon_zoom},}#{?window_activity_flag, #{@icon_activity},}#{?window_bell_flag, #{@icon_bell},}#{?window_silence_flag, #{@icon_silence},}#{?window_marked_flag, #{@icon_marked},} #[fg=#313244,bg=#11111b]#{@pill_right}"

# active pill: blue bg, dark text
set -g window-status-current-format "#[fg=#89b4fa,bg=#11111b]#{@pill_left}#[fg=#05050c,bg=#89b4fa,bold] #I #W#{?window_zoomed_flag, #{@icon_zoom},}#{?window_marked_flag, #{@icon_marked},} #[fg=#89b4fa,bg=#11111b]#{@pill_right}"

# pills handle their own spacing
set -g window-status-separator ""

# activity style (underline, keep default colors)
setw -g window-status-activity-style "underscore"

# bell: yellow blink
setw -g window-status-bell-style "fg=#f9e2af,blink,bold"

# -- pane borders -------------------------------------------------------------

set -g pane-border-style "fg=#0a0a13"
set -g pane-active-border-style "fg=#89b4fa"

# mode/sync-aware active border (tmux 3.2+)
%if #{>=:#{version},3.2}
set -g pane-active-border-style "#{?pane_in_mode,fg=#fab387,#{?synchronize-panes,fg=#f38ba8,fg=#89b4fa}}"
%endif

# pane title bar (shown in border)
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#89b4fa bold],#[fg=#9399b2]} #P: #{pane_title} #[default]"

# pane number indicator
set -g display-panes-colour "#313244"
set -g display-panes-active-colour "#89b4fa"

# -- messages and mode --------------------------------------------------------

set -g message-style "fg=#05050c,bg=#f9e2af,bold"
set -g message-command-style "fg=#f9e2af,bg=#05050c,bold"
set -g mode-style "fg=#05050c,bg=#f9e2af,bold"

# -- clock --------------------------------------------------------------------

setw -g clock-mode-colour "#89b4fa"
setw -g clock-mode-style 24

# -- terminal title -----------------------------------------------------------

set -g set-titles on
set -g set-titles-string "#h ❐ #S ● #I #W"
