# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Mocha with Tokyo Night-style approach:
# Dark surface backgrounds with colored text foregrounds for a cohesive, subtle look

format = """
$os\
$user\
$directory\
${custom.jj}\
$c\
$rust\
$ruby\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$time\
$cmd_duration\
${custom.cost}\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "fg:mauve"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = ""
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:mauve"
style_root = "fg:red"
format = '[ $user]($style)'

[directory]
style = "fg:sky"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ""
fish_style_pwd_dir_length = 2
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰧮"
"Downloads" = "󰇚"
"Music" = "󰎇"
"Pictures" = " "
"dotfiles" = "󰇙"

# Custom jj (Jujutsu) module - replaces git_branch/git_status
[custom.jj]
format = '[$output]($style)'
command = "jj-prompt"
style = "fg:sapphire"
ignore_timeout = false
shell = ["bash"]
use_stdin = false
when = true
require_repo = true

[c]
symbol = " "
style = "fg:green"
format = '[ $symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:peach"
format = '[ $symbol($version)]($style)'

[ruby]
symbol = " "
style = "fg:red"
format = '[ $symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:sky"
format = '[ $symbol($version)]($style)'

[nodejs]
symbol = " "
format = '[ $symbol($version)](fg:green)'

[php]
symbol = " "
style = "fg:lavender"
format = '[ $symbol($version)]($style)'

[java]
symbol = " "
style = "fg:red"
format = '[ $symbol($version)]($style)'

[kotlin]
symbol = " "
style = "fg:mauve"
format = '[ $symbol($version)]($style)'

[haskell]
symbol = " "
style = "fg:lavender"
format = '[ $symbol($version)]($style)'

[python]
symbol = " "
style = "fg:green"
format = '[ $symbol($version)(\(#$virtualenv\))]($style)'

[docker_context]
symbol = " "
style = "fg:sapphire"
format = '[ $symbol($context) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:lavender"
format = '[  $time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = false
format = "[  $duration](fg:yellow) "
disabled = false
show_notifications = false
min_time_to_notify = 45000
