# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Mocha with Tokyo Night-style approach:
# Dark surface backgrounds with colored text foregrounds for a cohesive, subtle look

format = """
[](base)\
$os\
$user\
$directory\
[ ](fg:surface0 bg:base)\
${custom.jj}\
[](bg:surface1 fg:surface0)\
$c\
$rust\
$ruby\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[ ](bg:surface1 fg:surface2)\
$docker_context\
$conda\
[ ](bg:surface2 fg:overlay0)\
$time\
[ ](fg:overlay0)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bg:base fg:mauve"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:base fg:mauve"
style_root = "bg:base fg:red"
format = '[ $user]($style)'

[directory]
style = "bg:base fg:sky"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"src" = ""
"dotfiles" = "󰇙"

# Custom jj (Jujutsu) module - replaces git_branch/git_status
[custom.jj]
command = "prompt"
format = "[ $output](fg:sapphire bg:surface0)"
style = "bg:surface0"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true

[c]
symbol = " "
style = "fg:green bg:surface1"
format = '[ $symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:peach bg:surface1"
format = '[ $symbol($version)]($style)'

[ruby]
symbol = " "
style = "fg:red bg:surface1"
format = '[ $symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:sky bg:surface1"
format = '[ $symbol($version)]($style)'

[nodejs]
symbol = " "
format = '[ $symbol($version)](fg:green bg:surface1)'

[php]
symbol = " "
style = "fg:lavender bg:surface1"
format = '[ $symbol($version)]($style)'

[java]
symbol = " "
style = "fg:red bg:surface1"
format = '[ $symbol($version)]($style)'

[kotlin]
symbol = " "
style = "fg:mauve bg:surface1"
format = '[ $symbol($version)]($style)'

[haskell]
symbol = " "
style = "fg:lavender bg:surface1"
format = '[ $symbol($version)]($style)'

[python]
symbol = " "
style = "fg:green bg:surface1"
format = '[ $symbol($version)(\(#$virtualenv\))]($style)'

[docker_context]
symbol = " "
style = "fg:sapphire bg:surface2"
format = '[ $symbol($context) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:crust bg:overlay0"
format = '[ $time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = false
format = "[ $duration](fg:yellow) "
disabled = false
show_notifications = true
min_time_to_notify = 45000
