# Kitty config - mirroring ghostty configuration
#
# See https://sw.kovidgoyal.net/kitty/conf/ for documentation

# Font Configuration
font_family      MonoLisa Nerd Font
font_size        10.0

# Font features
font_features    MonoLisaNerdFont-Regular +calt +liga +dlig +zero +ss02 +ss10 +ss11 +ss12 +ss13 +ss14 +ss15 +ss16

# Disable bold/italic synthesis
disable_ligatures never

# Shell Integration
shell_integration enabled

# Mouse & Window Behavior
hide_mouse_when_typing yes
remember_window_size   yes
initial_window_width   800
initial_window_height  600

# macOS Specific
macos_quit_when_last_window_closed no
macos_show_window_title_in none
macos_option_as_alt both

# Cursor Configuration
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
cursor_trail 1

# Theme - Catppuccin Mocha
include catppuccin-espresso.conf
macos_titlebar_color #11111b

# Window Layout
window_border_width 1pt
active_border_color   #585b70
inactive_border_color #181824
inactive_text_alpha   0.85

# Tab Bar
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #181824
active_tab_background   #cdd6f4
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244

# URL Handling
detect_urls yes
url_style single
open_url_with default

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Advanced
allow_remote_control yes
listen_on unix:/tmp/kitty

# Rebind with unicode characters
map super+[ previous_window
map super+] next_window
map super+shift+[ previous_tab
map super+shift+] next_tab
map super+equal change_font_size all +1.0
map super+plus change_font_size all +1.0
map super+shift+equal change_font_size all +1.0
map super+shift+plus change_font_size all +1.0
map super+minus change_font_size all -1.0
map super+0 change_font_size all 0

# Font size across all windows
map super+alt+equal change_font_size all +1.0
map super+alt+plus change_font_size all +1.0
map super+alt+shift+equal change_font_size all +1.0
map super+alt+shift+plus change_font_size all +1.0
map super+alt+minus change_font_size all -1.0
map super+alt+0 change_font_size all 0

# Basic keybindings
map super+w close_tab

# Shift+Enter for Claude Code
map shift+enter send_text all \x1b\r

######
# Tmux-inspired shortcuts with ctrl+s prefix
# Note: Kitty uses kitten for multi-key sequences

# Window/Tab Management
map ctrl+s>c new_tab
map ctrl+s>shift+7 close_tab
map ctrl+s>shift+[ move_tab_backward
map ctrl+s>shift+] move_tab_forward
map ctrl+s>w show_scrollback
map ctrl+s>, set_tab_title

# Switch Tabs
map ctrl+s>n next_tab
map ctrl+s>p previous_tab
map ctrl+s>shift+4 goto_tab -1
map ctrl+s>1 goto_tab 1
map ctrl+s>2 goto_tab 2
map ctrl+s>3 goto_tab 3
map ctrl+s>4 goto_tab 4
map ctrl+s>5 goto_tab 5
map ctrl+s>6 goto_tab 6
map ctrl+s>7 goto_tab 7
map ctrl+s>8 goto_tab 8
map ctrl+s>9 goto_tab 9
map ctrl+s>0 goto_tab 0

# Split Management (kitty uses launch --location)
map ctrl+s>backslash launch --location=split
map ctrl+s>shift+backslash launch --location=hsplit
map ctrl+s>shift+minus launch --location=vsplit
map ctrl+s>minus launch --location=hsplit
map ctrl+s>shift+5 launch --location=split
map ctrl+s>shift+2 launch --location=vsplit

# Navigate Splits
map ctrl+s>i next_window
map ctrl+s>o previous_window
map ctrl+s>space previous_window
map ctrl+s>h neighboring_window left
map ctrl+s>j neighboring_window down
map ctrl+s>k neighboring_window up
map ctrl+s>l neighboring_window right

# Resize Splits
map ctrl+s>shift+h resize_window narrower 2
map ctrl+s>shift+j resize_window taller 2
map ctrl+s>shift+k resize_window shorter 2
map ctrl+s>shift+l resize_window wider 2
map ctrl+s>equal reset_window_sizes

# Split/Pane Management
map ctrl+s>x close_window
map ctrl+s>z toggle_layout stack

# Scrolling (vim-style)
map ctrl+s>g>g scroll_home
map ctrl+s>shift+g scroll_end
map ctrl+s>u scroll_page_up
map ctrl+s>d scroll_page_down
map ctrl+s>[ scroll_to_prompt -1
map ctrl+s>] scroll_to_prompt 1

# Clear screen
map ctrl+l no_op
map ctrl+s>ctrl+l clear_terminal reset active

# Utility
map ctrl+s>shift+semicolon kitten hints
map ctrl+s>shift+/ show_kitty_doc overview
map ctrl+s>r load_config_file

# vim: ft=conf
