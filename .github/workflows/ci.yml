name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run ShellCheck
        run: |
          shellcheck install.sh
          shellcheck bin/setup
          shellcheck bin/test
          shellcheck bin/check-frontmatter

  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # No bats, no mise, no chezmoi: the checker runs on a bare shell so a
      # broken skill or agent is caught even when the rest of the toolchain is
      # unavailable.
      - name: Validate skill and agent frontmatter
        run: ./bin/check-frontmatter

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y vim tmux python3 yq
          npm install -g bats
      - name: Run configuration validation tests
        run: |
          bats test/config-validation.bats

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] # macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
      - name: Install chezmoi
        run: |
          GIT_USER_NAME="CI Test User" GIT_USER_EMAIL="ci@example.com" ./install.sh
      - name: Install config validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y vim tmux python3 python3-pip yq
          npm install -g bats
      - name: Install test dependencies
        run: |
          ./bin/setup
      - name: Run test suite
        run: |
          ./bin/test
