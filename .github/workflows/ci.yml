name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  download-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify Zellij release assets match pinned hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/check-zellij-plugins

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run ShellCheck
        run: |
          shellcheck install.sh
          shellcheck bin/setup
          shellcheck bin/test

  test:
    runs-on: ubuntu-latest
    env:
      MISE_AUTO_INSTALL: '0'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh jq ripgrep vim neovim lua5.4 tmux python3 python3-yaml
      - name: Run test suite
        run: |
          ./bin/test
