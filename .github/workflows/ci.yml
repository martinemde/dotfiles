name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  download-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Zellij release assets match pinned hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/check-zellij-plugins

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        run: |
          shellcheck install.sh
          shellcheck bin/setup
          shellcheck bin/test
          shellcheck bin/check-renovate-policy

  unit-tests:
    runs-on: ubuntu-latest
    env:
      MISE_AUTO_INSTALL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.11.1 # mise
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh jq ripgrep vim neovim lua5.4 tmux python3 python3-yaml
      - name: Validate Renovate configuration with the deployed engine
        run: |
          image=$(bun --eval 'const w = Bun.YAML.parse(await Bun.file(".github/workflows/renovate.yml").text()); console.log(w.jobs.renovate.container.image)')
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" renovate-config-validator --no-global renovate.json5
      - name: Verify effective policy and native dependency extraction
        run: bin/check-renovate-policy "$RUNNER_TEMP/renovate-resolved.json"
      - name: Run test suite
        env:
          RENOVATE_RESOLVED_CONFIG: ${{ runner.temp }}/renovate-resolved.json
        run: |
          ./bin/test

  tool-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [node, mise, python, cosign]
    env:
      MISE_AUTO_INSTALL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.11.1 # mise
      - name: Exercise tools from this checkout's manifests
        run: |
          read -r node uv < <(bun --eval 'const c = Bun.TOML.parse(await Bun.file("home/dot_config/mise/config.toml").text()); console.log(`node@${c.tools.node} uv@${c.tools.uv}`)')
          mise install "$node" "$uv"
          mise exec "$node" "$uv" -- python3 bin/check-tool-updates ${{ matrix.tool }}

  plugin-integration:
    runs-on: ubuntu-latest
    env:
      MISE_AUTO_INSTALL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.11.1 # mise
      - name: Install shell test dependency
        run: sudo apt-get update && sudo apt-get install -y zsh tmux
      - name: Exercise pinned zsh-snap cache behavior
        run: |
          python3 bin/check-znap-update
          python3 bin/check-tmux-updates

  # Keep one stable required check; a failed or cancelled integration must block it.
  test:
    if: always()
    needs:
      [
        download-integrity,
        shellcheck,
        unit-tests,
        tool-integration,
        plugin-integration,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
