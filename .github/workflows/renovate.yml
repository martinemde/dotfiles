name: Renovate

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan updates without writing to GitHub
        type: boolean
        default: true

# Live writes use a repository-scoped GitHub App token, not GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Stay quiet until the account owner installs and configures the App.
    if: github.event_name != 'schedule' || vars.RENOVATE_APP_ID != ''
    runs-on: ubuntu-latest
    container:
      # Actions command files are owned by the runner, not the image's default user.
      options: --user 0
      image: ghcr.io/renovatebot/renovate:44.216.5@sha256:029cf58d0213a20ed3f5e2c86f6261f29e73675b7e1b86659de096e0d3408051
    env:
      LOG_LEVEL: debug
      RENOVATE_PLATFORM: github
      RENOVATE_ONBOARDING: 'false'
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_REPOSITORY_CACHE: disabled
      RENOVATE_BASE_DIR: /tmp/renovate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository configuration
        run: renovate-config-validator --no-global renovate.json5
      - name: Check live credentials
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          APP_ID: ${{ vars.RENOVATE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo '::error::Live Renovate requires RENOVATE_APP_ID (repository variable) and RENOVATE_APP_PRIVATE_KEY (repository secret). See docs/renovate.md.'
            exit 1
          fi
      - name: Create repository-scoped App token
        if: github.event_name == 'schedule' || !inputs.dry_run
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-administration: read
          permission-checks: read
          permission-statuses: write
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-vulnerability-alerts: read
      - name: Plan dependency updates without writing to GitHub
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_DRY_RUN: full
        run: renovate "$GITHUB_REPOSITORY"
      - name: Update dependency branches, pull requests, and dashboard
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: renovate "$GITHUB_REPOSITORY"
      - name: Summarize run
        if: always()
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            MODE='Read-only dry run; no branches, PRs, or dashboard issues are written.'
          else
            MODE='Live run using the dedicated repository-scoped GitHub App.'
          fi
          printf '## Renovate\n\n%s\n\nResult: **%s**.\n\nLive setup and activation evidence: `docs/renovate.md`.\n' "$MODE" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
