name: Renovate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan updates without writing to GitHub
        type: boolean
        default: true

# Live updates and App credentials belong to martinemde/renovate-config.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    strategy:
      fail-fast: false
      matrix:
        repository:
          [dotfiles, martinemde.com, micropub-publisher, almanac, containers, beelink]
    runs-on: ubuntu-latest
    container:
      # Actions command files are owned by the runner, not the image's default user.
      options: --user 0
      image: ghcr.io/renovatebot/renovate:44.222.2@sha256:227e723ed8c57f1b8b629066c7e0ad8d8f933d905f4a2f6fb4d597a74118637c
    env:
      LOG_LEVEL: debug
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
      RENOVATE_ONBOARDING: 'false'
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_REPOSITORY_CACHE: disabled
      RENOVATE_BASE_DIR: /tmp/renovate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository configuration
        run: renovate-config-validator --no-global renovate.json5
      - name: Plan dependency updates without writing to GitHub
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_DRY_RUN: full
        run: renovate "$RENOVATE_REPOSITORY"
      - name: Summarize run
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            MODE='Read-only dry run; no branches, PRs, or dashboard issues are written.'
          else
            MODE='Configuration validation only; engine dry run was not requested.'
          fi
          printf '## Renovate\n\n%s\n\nResult: **%s**.\n\nLive updates: `martinemde/renovate-config`.\n' "$MODE" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
